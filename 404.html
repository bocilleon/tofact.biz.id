<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname;
            // Deteksi jika pengunjung mengakses /article1.html tanpa folder /articles/
            var match = path.match(/article(\d+)\.html/i);
            if (match) {
                // Otomatis arahkan ke path artikel yang benar di folder /articles/
                window.location.replace("/articles/article" + match[1] + ".html");
            } else {
                // Fallback jika halaman lain tidak ditemukan, kembalikan ke beranda
                window.location.replace("/");
            }
        })();
    </script>
</head>
<body style="background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    <div>
        <h2 style="font-size: 1.5rem; margin-bottom: 8px;">Memuat Artikel...</h2>
        <p style="color: #94a3b8; font-size: 0.95rem;">Mohon tunggu, Anda sedang dialihkan...</p>
    </div>
</body>
</html>
